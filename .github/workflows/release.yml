name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            apt_packages: libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libatk1.0-dev libcairo2-dev
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "--deny warnings"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kolo-${{ matrix.target }}.tar.gz kolo
          cd ../../..
          sha256sum kolo-${{ matrix.target }}.tar.gz > kolo-${{ matrix.target }}.tar.gz.sha256

      - name: Package (zip + exe)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/kolo.exe"
          $archive = "kolo-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ASCII "$archive.sha256"
          Copy-Item $bin "kolo-${{ matrix.target }}.exe"
          $hash = (Get-FileHash "kolo-${{ matrix.target }}.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  kolo-${{ matrix.target }}.exe" | Out-File -Encoding ASCII "kolo-${{ matrix.target }}.exe.sha256"

      - name: Install WiX + cargo-wix + build MSI
        if: matrix.archive == 'zip'
        run: |
          choco install wixtoolset -y --version=3.14.1
          cargo install cargo-wix --version 0.3.9
          $env:CARGO_TARGET_DIR = "target"
          $env:CARGO_BUILD_TARGET = "${{ matrix.target }}"
          cargo wix --no-build --nocapture -o "kolo-${{ matrix.target }}.msi"
          $hash = (Get-FileHash "kolo-${{ matrix.target }}.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  kolo-${{ matrix.target }}.msi" | Out-File -Encoding ASCII "kolo-${{ matrix.target }}.msi.sha256"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: kolo-${{ matrix.target }}
          path: |
            kolo-${{ matrix.target }}.${{ matrix.archive }}
            kolo-${{ matrix.target }}.${{ matrix.archive }}.sha256
            kolo-${{ matrix.target }}.exe
            kolo-${{ matrix.target }}.exe.sha256
            kolo-${{ matrix.target }}.msi
            kolo-${{ matrix.target }}.msi.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display artifacts
        run: ls -laR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
